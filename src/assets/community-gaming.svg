<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182A45"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
    <linearGradient id="glow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63D6D0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#63D6D0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="100%" stop-color="#E28938"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63D6D0"/>
      <stop offset="100%" stop-color="#34A39D"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="12" fill="url(#grid-grad)" stroke="#33475E" stroke-width="2"/>

  <!-- Blueprint Grid Pattern -->
  <g stroke="#F5F1EA" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="600" y2="75"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="225" x2="600" y2="225"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Decorative Target & Orbit Rings -->
  <circle cx="300" cy="225" r="160" fill="none" stroke="#63D6D0" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="300" cy="225" r="100" fill="none" stroke="#FFB86B" stroke-opacity="0.2"/>
  <circle cx="300" cy="225" r="40" fill="url(#glow-teal)"/>

  <!-- Center Gaming Controller Isometric Art -->
  <g transform="translate(190, 130)">
    <!-- Controller Body Shadow -->
    <path d="M40 90 C30 50 50 20 90 20 L130 20 C170 20 190 50 180 90 L195 130 C205 160 170 175 145 150 L125 135 L95 135 L75 150 C50 175 15 160 25 130 Z"
          fill="#162338" stroke="#3F5875" stroke-width="3"/>
    
    <!-- Main Controller Faceplate -->
    <path d="M42 85 C32 48 52 22 88 22 L132 22 C168 22 188 48 178 85 L192 124 C200 150 172 165 148 142 L128 128 L92 128 L72 142 C48 165 20 150 28 124 Z"
          fill="#22334A" stroke="#63D6D0" stroke-width="2.5"/>

    <!-- D-Pad -->
    <rect x="58" y="65" width="28" height="10" rx="3" fill="#FFB86B"/>
    <rect x="67" y="56" width="10" height="28" rx="3" fill="#FFB86B"/>
    <circle cx="72" cy="70" r="3" fill="#101A2C"/>

    <!-- Action Buttons (Teal & Lavender & Amber) -->
    <circle cx="150" cy="62" r="5" fill="#63D6D0"/>
    <circle cx="162" cy="74" r="5" fill="#C8B8F2"/>
    <circle cx="138" cy="74" r="5" fill="#FFB86B"/>
    <circle cx="150" cy="86" r="5" fill="#F5F1EA"/>

    <!-- Analog Sticks -->
    <circle cx="85" cy="100" r="15" fill="#141F30" stroke="#63D6D0" stroke-width="1.5"/>
    <circle cx="85" cy="100" r="9" fill="#2E445F"/>
    
    <circle cx="135" cy="100" r="15" fill="#141F30" stroke="#FFB86B" stroke-width="1.5"/>
    <circle cx="135" cy="100" r="9" fill="#2E445F"/>

    <!-- Center LED Indicator & CA Monogram -->
    <rect x="100" y="55" width="20" height="10" rx="3" fill="#101A2C" stroke="#63D6D0" stroke-width="1"/>
    <circle cx="110" cy="60" r="2.5" fill="#63D6D0"/>
  </g>

  <!-- Collaborative Player Node Badges -->
  <!-- Left Player Node -->
  <g transform="translate(60, 240)">
    <rect width="130" height="64" rx="8" fill="#101A2C" stroke="#FFB86B" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="15" fill="#FFB86B"/>
    <text x="28" y="37" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" fill="#101A2C" text-anchor="middle">P1</text>
    <text x="52" y="27" font-family="'DM Mono', monospace" font-size="9" fill="#FFB86B" font-weight="700">PLAYER ONE</text>
    <text x="52" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#F5F1EA" font-weight="600">Access Granted</text>
    <line x1="130" y1="32" x2="200" y2="200" stroke="#FFB86B" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Right Player Node -->
  <g transform="translate(410, 80)">
    <rect width="135" height="64" rx="8" fill="#101A2C" stroke="#63D6D0" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="15" fill="#63D6D0"/>
    <text x="28" y="37" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" fill="#101A2C" text-anchor="middle">P2</text>
    <text x="52" y="27" font-family="'DM Mono', monospace" font-size="9" fill="#63D6D0" font-weight="700">COMMUNITY</text>
    <text x="52" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#F5F1EA" font-weight="600">Connected Hub</text>
    <line x1="0" y1="40" x2="-70" y2="120" stroke="#63D6D0" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Bottom Mentorship Node -->
  <g transform="translate(380, 310)">
    <rect width="160" height="64" rx="8" fill="#101A2C" stroke="#C8B8F2" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="15" fill="#C8B8F2"/>
    <text x="28" y="37" font-family="'DM Sans', sans-serif" font-weight="800" font-size="12" fill="#101A2C" text-anchor="middle">CA</text>
    <text x="52" y="27" font-family="'DM Mono', monospace" font-size="9" fill="#C8B8F2" font-weight="700">SAFE ARENA</text>
    <text x="52" y="44" font-family="'DM Sans', sans-serif" font-size="11" fill="#F5F1EA" font-weight="600">Zero Toxicity Active</text>
    <line x1="20" y1="0" x2="-40" y2="-60" stroke="#C8B8F2" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Technical Stamp Corner -->
  <text x="30" y="45" font-family="'DM Mono', monospace" font-size="11" fill="#FFB86B" letter-spacing="2">CADARENA // FIG. 01</text>
  <text x="30" y="415" font-family="'DM Mono', monospace" font-size="9" fill="#AAB6C7" letter-spacing="1">PURPOSEFUL PLAY &bull; YOUTH INCLUSION</text>
  <text x="570" y="415" font-family="'DM Mono', monospace" font-size="9" fill="#63D6D0" letter-spacing="1" text-anchor="end">NON-PROFIT INITIATIVE</text>
</svg>

